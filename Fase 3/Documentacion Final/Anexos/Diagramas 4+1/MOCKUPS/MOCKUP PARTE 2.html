    // --- Authentication & Routing ---
    let currentUserRole = null;

    function login() {
        const role = document.getElementById('role-selector').value;
        currentUserRole = role;
        
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('app-view').classList.remove('hidden');
        document.getElementById('app-view').classList.add('flex');
        
        setupUIForRole(role);
    }
    
    function logout() {
        currentUserRole = null;
        document.getElementById('app-view').classList.add('hidden');
        document.getElementById('app-view').classList.remove('flex');
        document.getElementById('login-view').style.display = 'flex';
    }

    function setupUIForRole(role) {
        const config = rolesConfig[role];
        if (!config) return;

        // Setup Header
        document.getElementById('user-role-display').textContent = `Rol: ${config.name}`;

        // Setup Sidebar
        const nav = document.getElementById('sidebar-nav');
        nav.innerHTML = '';
        config.views.forEach((view, index) => {
            const isActive = index === 0 ? 'bg-blue-600' : 'hover:bg-slate-700';
            const link = document.createElement('a');
            link.href = '#';
            link.className = `nav-item block py-2.5 px-4 rounded transition duration-200 ${isActive}`;
            link.innerHTML = `${view.icon} ${view.title}`;
            link.onclick = () => showView(role, view.id);
            nav.appendChild(link);
        });

        // Setup Main Content
        const mainContent = document.getElementById('main-content');
        mainContent.innerHTML = ''; // Clear previous content
        config.views.forEach(view => {
            const viewContainer = document.createElement('div');
            viewContainer.id = view.id;
            viewContainer.className = 'view';
            viewContainer.innerHTML = getViewContent(view.id);
            mainContent.appendChild(viewContainer);
        });

        // Show the first view by default
        showView(role, config.views[0].id);
    }
    
    function showView(role, viewId) {
        const mainContent = document.getElementById('main-content');
        // Hide all views for the current role
        mainContent.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        // Show the selected view
        mainContent.querySelector(`#${viewId}`).classList.add('active');

        // Update active nav item
        const nav = document.getElementById('sidebar-nav');
        nav.querySelectorAll('.nav-item').forEach(item => {
            item.classList.remove('bg-blue-600');
            item.classList.add('hover:bg-slate-700');
        });
        const activeItem = Array.from(nav.querySelectorAll('.nav-item')).find(item => item.textContent.trim() === rolesConfig[role].views.find(v => v.id === viewId).title);
        if(activeItem) {
            activeItem.classList.add('bg-blue-600');
            activeItem.classList.remove('hover:bg-slate-700');
        }

        // Update header title
        document.getElementById('view-title').textContent = rolesConfig[role].views.find(v => v.id === viewId).title;
    }

    function verifyVehicle() {
        const plateInput = document.getElementById('gate-plate-input');
        const resultDiv = document.getElementById('gate-result');
        if (!plateInput || !resultDiv) return;
        
        const plate = plateInput.value.toUpperCase();
        
        if (plate === 'PPDD-21') {
            resultDiv.innerHTML = '<div class="p-4 bg-green-50 text-green-800 rounded-lg text-center">Patente PPDD-21: **AUTORIZADO PARA INGRESAR**</div>';
        } else if (plate === 'ZXCV-12') {
            resultDiv.innerHTML = '<div class="p-4 bg-blue-50 text-blue-800 rounded-lg text-center">Patente ZXCV-12: **AUTORIZADO PARA SALIR**</div>';
        } else {
            resultDiv.innerHTML = '<div class="p-4 bg-red-50 text-red-800 rounded-lg text-center">Patente ' + plate + ': **NO AUTORIZADO**</div>';
        }
    }
